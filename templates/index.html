<!DOCTYPE html>
<html>

<head>
    <title>Smart Health Care</title>
</head>

<body>

    <h1>Smart Health Care</h1>

    <h2>Add Patient</h2>

    <form action="/add_patient" method="POST">

        <label>Patient Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" required>
        <br><br>

        <label>Gender:</label>
        <select name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label>Phone:</label>
        <input type="text" name="phone" required>
        <br><br>

        <button type="submit">Add Patient</button>

    </form>

    <br><br>

    <!-- View Patients Button -->
    <a href="/patients">
        <button type="button">View Patients</button>
    </a>
<br><br>

<a href="/doctors">
    <button type="button">Doctor Management</button>
</a>
<br><br>

<a href="/appointments">
    <button type="button">Appointment Management</button>
</a>


</body>

</html>
