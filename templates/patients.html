<!DOCTYPE html>
<html>

<head>
    <title>View Patients</title>
</head>

<body>

    <h1>Smart Health Care</h1>

    <h2>Patient Records</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
        </tr>

        {% for patient in patients %}

        <tr>
            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[2] }}</td>
            <td>{{ patient[3] }}</td>
            <td>{{ patient[4] }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Home</a>

</body>

</html>
